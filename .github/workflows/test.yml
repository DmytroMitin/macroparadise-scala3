name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test (Scala ${{ matrix.scala-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scala-version: "3.3.8"
            opposite-scala-version: "3.8.4"
          - scala-version: "3.8.4"
            opposite-scala-version: "3.3.8"
          - scala-version: "3.9.0"
            opposite-scala-version: "3.3.8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Prepare opposite exact plugin artifact
        run: |
          sbt -Dmacroparadise.exactScalaVersion=${{ matrix.opposite-scala-version }} -batch '++${{ matrix.opposite-scala-version }}!' plugin/packageBin

      - name: Verify source-built sbt integration
        working-directory: sbt-integration
        run: |
          sbt -batch verifyIntegrationPolicy test scripted packageSrc packageDoc

      - name: Verify public-product build boundary (Scala ${{ matrix.scala-version }})
        run: |
          java -version
          sbt -Dmacroparadise.exactScalaVersion=${{ matrix.scala-version }} -batch '++${{ matrix.scala-version }}!' verifyPublicProductBoundary
